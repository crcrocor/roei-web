<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Russian Orthodox Educational Institute Incorporated">
  <title>ROEI</title>
  <style>
    :root {
      color-scheme: light;
      font-family: ui-serif, Georgia, Cambria, "Times New Roman", serif;
      background: #f7f5ef;
      color: #25231f;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    main {
      width: min(100%, 42rem);
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(3.75rem, 14vw, 7.5rem);
      font-weight: 500;
      letter-spacing: 0.08em;
      line-height: 0.95;
    }

    .name {
      margin: 1.25rem auto 0;
      max-width: 32rem;
      font-size: clamp(1.05rem, 3vw, 1.35rem);
      line-height: 1.45;
    }

    .details {
      margin: 2rem 0 0;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.875rem;
      line-height: 1.7;
      color: #676157;
    }

    address { font-style: normal; }
  </style>
</head>
<body>
  <main>
    <h1>ROEI</h1>
    <p class="name">Russian Orthodox Educational Institute Incorporated</p>
    <div class="details">
      <div>New Zealand incorporated society 2196742</div>
      <div>NZBN 9429043095995</div>
      <address>455–461 Dominion Road, Mt Eden, Auckland</address>
    </div>
  </main>
</body>
</html>
